services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: prereqs
      POSTGRES_PASSWORD: prereqs
      POSTGRES_DB: prereqs
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prereqs"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://prereqs:prereqs@db:5432/prereqs
      DATA_ROOT: /srv/data
      COMMITTED_ROOT: /srv/data-committed
      # Dev only: transcript import talks to the host's Ollama. Prod compose
      # leaves this unset, so the feature refuses cleanly (503 / hidden UI).
      OLLAMA_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8200:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/srv/backend
      - ./data:/srv/data:ro
      - ./data-committed:/srv/data-committed:ro
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      # Empty = same-origin API calls proxied by vite (see vite.config.ts).
      # An absolute http://localhost:8200 would be baked into the browser
      # bundle and break for anyone opening the dev server from another
      # machine on the LAN, where "localhost" is their own box.
      VITE_API_URL: ""
      BACKEND_URL: http://backend:8000
      VITE_ENABLE_AUTH: "1"   # auth UI is dev-only until accounts ship
    ports:
      - "5273:5173"
    volumes:
      - ./frontend:/srv/frontend
      - /srv/frontend/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  pgdata:
